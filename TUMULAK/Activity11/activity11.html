<html><head>
    <title>Loops Activity</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <div id="box1">
            <h2>For Loop</h2>

            <form id="forLoop">
                <label for="num1">Number:</label>
                <input type="text" id="num1" name="num1"><br><br>

                <label for="text1">Text:</label>
                <input type="text" id="text1" name="text1"><br><br>

                <button type="button" onclick="forLoop()">Show</button>
                <button type="reset" onclick="clearFor()">Clear</button>
            </form>

            <p id="output1"></p>
        </div>

        <div id="box2">
            <h2>While Loop</h2>

            <form id="whileLoop">
                <label for="num2">Number:</label>
                <input type="text" id="num2" name="num2"><br><br>

                <label for="text2">Text:</label>
                <input type="text" id="text2" name="text2"><br><br>

                <button type="button" onclick="whileLoop()">Show</button>
                <button type="reset" onclick="clearWhile()">Clear</button>
            </form>

            <p id="output2"></p>
        </div>

        <div id="box3">
            <h2>Do-While Loop</h2>

            <form id="doWhileLoop">
                <label for="num3">Number:</label>
                <input type="text" id="num3" name="num3"><br><br>

                <label for="text3">Text:</label>
                <input type="text" id="text3" name="text3"><br><br>

                <button type="button" onclick="doWhileLoop()">Show</button>
                <button type="reset" onclick="clearDoWhile()">Clear</button>
            </form>

            <p id="output3"></p>
        </div>

    </div>



</body></html>
